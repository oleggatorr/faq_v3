{% extends "base.html" %}

{% block title %}Редактировать: {{ target_agent.full_name }}{% endblock %}

{% block content %}
<h1>Редактировать оператора</h1>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post">
  <!-- ФИО -->
  <div class="mb-3">
    <label class="form-label">ФИО *</label>
    <input type="text" name="full_name" class="form-control"
           value="{{ target_agent.full_name }}" required>
  </div>

  <!-- Логин -->
  <div class="mb-3">
    <label class="form-label">Логин *</label>
    <input type="text" name="login" class="form-control"
           value="{{ target_agent.login }}" required>
  </div>

  <!-- Email -->
  <div class="mb-3">
    <label class="form-label">Email *</label>
    <input type="email" name="email" class="form-control"
           value="{{ target_agent.email }}" required>
  </div>

  <!-- Пароль (необязательно) -->
  <div class="mb-3">
    <label class="form-label">Новый пароль <small class="text-muted">(оставьте пустым, чтобы не менять)</small></label>
    <input type="password" name="password" class="form-control">
  </div>

  <!-- Телефон -->
  <div class="mb-3">
    <label class="form-label">Телефон</label>
    <input type="tel" name="phone" class="form-control" 
           value="{{ target_agent.phone or '' }}">
  </div>

  <!-- Роль -->
  <div class="mb-3">
    <label class="form-label">Роль *</label>
    <select name="role" id="role" class="form-select" onchange="toggleFields()">
      <option value="operator" {% if target_agent.role == 'operator' %}selected{% endif %}>Оператор</option>
      <option value="admin" {% if target_agent.role == 'admin' %}selected{% endif %}>Администратор</option>
    </select>
  </div>

  <!-- Департамент -->
  <div class="mb-3">
    <label class="form-label">Основной департамент *</label>
    <select name="department_id" class="form-select">
      {% for d in departments %}
        <option value="{{ d.id }}" {% if d.id == target_agent.department_id %}selected{% endif %}>
          {{ d.name }}
        </option>
      {% endfor %}
    </select>
  </div>

  <!-- Статус -->
  <div class="mb-3 form-check">
    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" 
           {% if target_agent.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Активен</label>
  </div>

  <hr>

  <!-- Доступ к департаментам -->
  <div id="category_block" {% if target_agent.role == 'admin' %}style="display:none"{% endif %}>
    <label class="form-label">Доступ к департаментам:</label><br>
    {% for d in departments %}
      <div class="form-check">
        <input type="checkbox" name="category_access" class="form-check-input" 
               id="cat_{{ d.id }}" value="{{ d.id }}"
               {% if d.id|string in selected_categories %}checked{% endif %}>
        <label class="form-check-label" for="cat_{{ d.id }}">{{ d.name }}</label>
      </div>
    {% endfor %}
  </div>

  <!-- Права доступа -->
  <div id="permissions_block" {% if target_agent.role == 'admin' %}style="display:none"{% endif %}>
    <label class="form-label mt-3">Права:</label><br>
    {% for p in permissions_list %}
      <div class="form-check">
        <input type="checkbox" name="permissions" class="form-check-input" 
               id="perm_{{ p.value }}" value="{{ p.value }}"
               {% if p.value in selected_permissions %}checked{% endif %}>
        <label class="form-check-label" for="perm_{{ p.value }}">
          {{ permission_labels.get(p, p.value) }}
        </label>
      </div>
    {% endfor %}
  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
    <a href="/agents" class="btn btn-secondary">Отмена</a>
  </div>
</form>

<script>
function toggleFields() {
  const role = document.getElementById("role").value;
  const category = document.getElementById("category_block");
  const permissions = document.getElementById("permissions_block");

  if (role === "admin") {
    category.style.display = "none";
    permissions.style.display = "none";
  } else {
    category.style.display = "block";
    permissions.style.display = "block";
  }
}
// Инициализация при загрузке
document.addEventListener('DOMContentLoaded', toggleFields);
</script>
{% endblock %}
