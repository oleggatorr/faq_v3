<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <header>
      <nav>
        {% if agent %}
          <button type="button" class="back-btn" onclick="goBack()">← Назад</button> |
          <a href="/home-page">Домой</a> |
          <a href="/tickets">Тикеты</a> |
          <a href="/agents">Операторы</a> |
          <a href="/departments">Департаменты</a> |
          <a href="/question-category-list">Категории</a>
          {% if agent.role == 'admin' %} | <a href="/logs">Логи</a>{% endif %}
          | <a href="/accaunt">Аккаунт</a>
          | {{ agent.login }} |
          <form method="post" action="/logout" style="display:inline;"><button type="submit">Выход</button></form>
        {% else %}
          <button type="button" class="back-btn" onclick="goBack()">← Назад</button> |
          <a href="/new-ticket">Создать обращение</a> |
          <a href="/get-ticket">Найти по треку</a> |
          <a href="/login">Вход</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
  </body>
</html>
