{% extends "base.html" %}

{% block title %}Создать тикет{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">📝 Создать тикет</h1>
  <a href="/tickets" class="btn btn-outline-secondary">
    ← Назад к списку
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">
        <h2 class="h4 mb-0">📋 Новое обращение от клиента</h2>
      </div>
      <div class="card-body">
        <form method="post" action="/tickets/create" enctype="multipart/form-data">
          <!-- Контактные данные клиента -->
          <h5 class="mb-3">👤 Данные клиента</h5>
          
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="customer_name" class="form-label">Имя клиента *</label>
              <input 
                type="text" 
                class="form-control" 
                id="customer_name"
                name="customer_name" 
                required
                placeholder="Иванов Иван"
              />
            </div>
            
            <div class="col-md-6">
              <label for="customer_email" class="form-label">Email клиента *</label>
              <input 
                type="email" 
                class="form-control" 
                id="customer_email"
                name="customer_email" 
                required
                placeholder="ivan@example.com"
              />
            </div>
          </div>

          <!-- Информация о тикете -->
          <h5 class="mb-3">📋 Информация о тикете</h5>
          
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="subject" class="form-label">Тема *</label>
              <input 
                type="text" 
                class="form-control" 
                id="subject"
                name="subject" 
                required
                placeholder="Краткое описание проблемы"
              />
            </div>
            
            <div class="col-md-4">
              <label for="department_id" class="form-label">Департамент *</label>
              <select name="department_id" id="department_id" class="form-select" required>
                <option value="">— Выберите —</option>
                {% for d in departments %}
                  <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
              </select>
            </div>
            
            <div class="col-md-6">
              <label for="category_id" class="form-label">Категория</label>
              <select name="category_id" id="category_id" class="form-select">
                <option value="">— Не указана —</option>
                {% for c in categories %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
            
            <div class="col-md-6">
              <label for="priority" class="form-label">Приоритет</label>
              <select name="priority" id="priority" class="form-select">
                <option value="low">Низкий</option>
                <option value="normal" selected>Обычный</option>
                <option value="high">Высокий</option>
                <option value="critical">Критический</option>
              </select>
            </div>
          </div>

          <!-- Сообщение -->
          <div class="mb-4">
            <label for="body" class="form-label">Сообщение *</label>
            <textarea 
              class="form-control" 
              id="body"
              name="body" 
              rows="8" 
              required
              placeholder="Подробное описание проблемы..."
            ></textarea>
          </div>

          <!-- Кнопки -->
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              ✓ Создать тикет
            </button>
            <a href="/tickets" class="btn btn-outline-secondary">
              Отмена
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
