{% extends "base.html" %}

{% block title %}Обращение создано{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header text-center">
        <h2 class="h4 mb-0">✅ Обращение успешно создано</h2>
      </div>
      <div class="card-body text-center">
        <p class="lead mb-4">
          Сохраните номер обращения для отслеживания статуса:
        </p>
        
        <div class="track-display mb-4">
          {{ track_id }}
        </div>
        
        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
          <a href="/new-ticket" class="btn btn-primary">
            📝 Создать ещё одно
          </a>
          <a href="/get-ticket" class="btn btn-outline-secondary">
            🔍 Отследить статус
          </a>
          <a href="/" class="btn btn-outline-secondary">
            🏠 На главную
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
