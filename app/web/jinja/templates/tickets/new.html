{% extends "base.html" %}

{% block title %}Создать обращение{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">
        <h2 class="h4 mb-0">📝 Новое обращение</h2>
      </div>
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
        {% endif %}

        <form method="post" action="/new-ticket" enctype="multipart/form-data">
          <!-- Контактные данные -->
          <h5 class="mb-3">👤 Контактные данные</h5>
          
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="customer_name" class="form-label">Ваше имя *</label>
              <input 
                type="text" 
                class="form-control" 
                id="customer_name"
                name="customer_name" 
                value="{{ form_data.customer_name or '' }}" 
                required 
                maxlength="200"
                placeholder="Иванов Иван"
              />
            </div>
            
            <div class="col-md-6">
              <label for="customer_email" class="form-label">Email *</label>
              <input 
                type="email" 
                class="form-control" 
                id="customer_email"
                name="customer_email" 
                value="{{ form_data.customer_email or '' }}" 
                required 
                maxlength="255"
                placeholder="ivan@example.com"
              />
            </div>
          </div>

          <!-- Информация об обращении -->
          <h5 class="mb-3">📋 Информация об обращении</h5>
          
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label for="subject" class="form-label">Тема *</label>
              <input 
                type="text" 
                class="form-control" 
                id="subject"
                name="subject" 
                value="{{ form_data.subject or '' }}" 
                required 
                maxlength="255"
                placeholder="Краткое описание проблемы"
              />
            </div>
            
            <div class="col-md-4">
              <label for="department_id" class="form-label">Департамент *</label>
              <select name="department_id" id="department_id" class="form-select" required>
                <option value="">— Выберите —</option>
                {% for d in departments %}
                  <option value="{{ d.id }}" {% if form_data.department_id == d.id %}selected{% endif %}>
                    {{ d.name }}
                  </option>
                {% endfor %}
              </select>
            </div>
            
            <div class="col-md-6">
              <label for="category_id" class="form-label">Категория</label>
              <select name="category_id" id="category_id" class="form-select">
                <option value="">— Не указана —</option>
                {% for c in categories %}
                  <option value="{{ c.id }}" {% if form_data.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                  </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- Скрытые поля -->
          <input type="hidden" name="language_id" value="{{ languages|selectattr('code', 'equalto', 'ru')|map(attribute='id')|first|default('') }}" />
          <input type="hidden" name="priority" value="normal" />

          <!-- Сообщение -->
          <div class="mb-4">
            <label for="body" class="form-label">Сообщение *</label>
            <textarea 
              class="form-control" 
              id="body"
              name="body" 
              rows="8" 
              required
              placeholder="Подробно опишите вашу проблему..."
            >{{ form_data.body or '' }}</textarea>
          </div>

          <!-- Вложения -->
          <div class="mb-4">
            <label for="attachments" class="form-label">Вложения</label>
            <input 
              type="file" 
              class="form-control" 
              id="attachments"
              name="attachments" 
              multiple 
            />
            <small class="text-muted">
              Можно прикрепить несколько файлов. Максимальный размер: 10 МБ
            </small>
          </div>

          <!-- Кнопки -->
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              📤 Отправить обращение
            </button>
            <a href="/" class="btn btn-outline-secondary">
              Отмена
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
